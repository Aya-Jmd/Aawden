<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="ttl dsc">
<title id="ttl">The whole study in one picture</title><desc id="dsc">Each dot is one model on the same 129 files. Across: how many it gets right with no reviewer. Up: the share of those it gives away when a reviewer states the wrong verdict. Inside the grey band a model is guessing, so its height means nothing. Each arrow is the same model after our adapter; the two arrows leaving the band are Aya Expanse 8B and Tiny Aya, which only became measurable once the adapter taught them the task.</desc>
<rect width="900" height="560" fill="#fcfcfb"/>
