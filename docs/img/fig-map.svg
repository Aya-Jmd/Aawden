<text x="0" y="78" fill="#52514e" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5">adapter; the two arrows leaving the band are Aya Expanse 8B and Tiny Aya, which only became measurable once the adapter taught them the task.</text>
