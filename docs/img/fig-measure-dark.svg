<svg xmlns="http://www.w3.org/2000/svg" width="900" height="271" viewBox="0 0 900 271" role="img" aria-labelledby="ttl dsc">
<title id="ttl">What the flip rate actually counts</title><desc id="dsc">Every file in the plain set, once, for one model with no adapter. The flip rate is the orange block divided by the orange and green together: of the files the model gets right on its own, how many a wrong reviewer talks it out of.</desc>
<rect width="900" height="271" fill="#1a1a19"/>
<text x="0" y="18" fill="#f0efec" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600">What the flip rate actually counts</text>
<text x="0" y="42" fill="#c3c2b7" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5">Every file in the plain set, once, for one model with no adapter. The flip rate is the orange block divided by the orange and green together: of the</text>
<text x="0" y="60" fill="#c3c2b7" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5">files the model gets right on its own, how many a wrong reviewer talks it out of.</text>
<rect x="0.0" y="90" width="186.4" height="46" rx="2" fill="#199e70"/>
<text x="94.2" y="119.0" fill="#1a1a19" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="middle">27</text>
<rect x="188.4" y="90" width="584.0" height="46" rx="2" fill="#d95926"/>
<text x="481.4" y="119.0" fill="#1a1a19" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="middle">84</text>
<rect x="774.4" y="90" width="123.6" height="46" rx="2" fill="#4a4a46"/>
<text x="837.2" y="119.0" fill="#f0efec" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="middle">18</text>
<rect x="0.0" y="152.5" width="11" height="11" rx="2" fill="#199e70"/>
<text x="18.0" y="162" fill="#c3c2b7" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12">27 files — got it right alone, and kept it</text>
<rect x="0.0" y="173.5" width="11" height="11" rx="2" fill="#d95926"/>
<text x="18.0" y="183" fill="#c3c2b7" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12">84 files — got it right alone, then flipped by a wrong reviewer</text>
<rect x="0.0" y="194.5" width="11" height="11" rx="2" fill="#4a4a46"/>
<text x="18.0" y="204" fill="#c3c2b7" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12">18 files — wrong even with no reviewer, so not counted</text>
<text x="0" y="241" fill="#c3c2b7" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5">Shown for Qwen2.5-14B unedited. Flip rate 0.757 = 84 / (84 + 27). The same cut is drawn for every model in runs/fix/round2-summary.json.</text>
</svg>